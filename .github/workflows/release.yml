name: Build and Publish Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-go

      - name: Install dependencies
        shell: msys2 {0}
        run: |
          export GOROOT=/mingw64/lib/go
          export GOPATH=/mingw64
          go mod download
          go install github.com/tc-hib/go-winres@latest

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "tag=latest" >> $env:GITHUB_OUTPUT
          }

      - name: Build Windows GUI
        shell: msys2 {0}
        run: |
          export GOROOT=/mingw64/lib/go
          export GOPATH=/mingw64
          make GUI=1 VERSION="${{ steps.version.outputs.tag }}"
          mv build/VencordInstaller.exe VencordArabicInstaller.exe

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash VencordArabicInstaller.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VencordArabicInstaller.exe" | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VencordArabicInstaller-Windows
          path: |
            VencordArabicInstaller.exe
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          if ($tag -eq "latest") {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f latest $env:GITHUB_SHA
            git push origin refs/tags/latest --force
          }

          $notes = "Vencord Arabic Installer for Windows.`n`nUnofficial Arabic-focused fork of the GPL-licensed Vencord Installer. It downloads Vencord Arabic builds from ShadowUR0/Vencord and is not affiliated with Discord or the official Vencord team.`n`nSource commit: $env:GITHUB_SHA"
          $notes | Set-Content release-notes.md -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "Vencord Arabic Installer - $tag" --notes-file release-notes.md
            gh release upload $tag VencordArabicInstaller.exe SHA256SUMS.txt --clobber
          } else {
            gh release create $tag VencordArabicInstaller.exe SHA256SUMS.txt --target $env:GITHUB_SHA --title "Vencord Arabic Installer - $tag" --notes-file release-notes.md
          }
