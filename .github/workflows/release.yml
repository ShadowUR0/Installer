name: Build and Publish Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-go

      - name: Install dependencies
        shell: msys2 {0}
        run: |
          export GOROOT=/mingw64/lib/go
          export GOPATH=/mingw64
          go mod download
          go install github.com/tc-hib/go-winres@latest

      - name: Build Windows GUI and CLI
        shell: msys2 {0}
        run: |
          export GOROOT=/mingw64/lib/go
          export GOPATH=/mingw64
          mkdir -p dist

          make GUI=1 ARCH=amd64 VERSION="$VERSION"
          cp build/VencordInstaller.exe dist/VencordArabicInstaller.exe

          make clean
          make GUI=0 ARCH=amd64 VERSION="$VERSION"
          cp build/VencordInstallerCli.exe dist/VencordArabicInstallerCli.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VencordArabicInstaller-Windows
          path: dist/*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            asset_arch: x86_64
          - goarch: arm64
            asset_arch: arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download Go dependencies
        run: go mod download

      - name: Build Linux CLI
        run: |
          make PLATFORM=linux ARCH=${{ matrix.goarch }} GUI=0 VERSION="$VERSION"
          mkdir -p dist
          cp build/VencordInstallerCli-linux dist/VencordArabicInstallerCli-linux-${{ matrix.asset_arch }}
          chmod +x dist/VencordArabicInstallerCli-linux-${{ matrix.asset_arch }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: VencordArabicInstaller-Linux-${{ matrix.asset_arch }}
          path: dist/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install macOS build dependencies
        run: brew install pkg-config sdl2 create-dmg

      - name: Download Go dependencies
        run: go mod download

      - name: Build universal macOS DMG
        run: |
          make ARCH=universal GUI=1 DMG=1 IDENTITY="-" VERSION="$VERSION"
          mkdir -p dist
          cp build/VencordInstaller.dmg dist/VencordArabicInstaller-macos-universal.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: VencordArabicInstaller-macOS
          path: dist/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
      - build-macos

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: VencordArabicInstaller-Windows
          path: dist

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: VencordArabicInstaller-Linux-x86_64
          path: dist

      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: VencordArabicInstaller-Linux-arm64
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: VencordArabicInstaller-macOS
          path: dist

      - name: Create SHA-256 checksums
        run: |
          cd dist
          sha256sum VencordArabicInstaller* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish rolling or tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="latest"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f latest "$GITHUB_SHA"
            git push origin refs/tags/latest --force
          fi

          cat > release-notes.md <<EOF
          Vencord Arabic Installer for Windows, Linux, and macOS.

          Included builds:
          - Windows x86_64 GUI and CLI
          - Linux x86_64 CLI
          - Linux arm64 CLI
          - macOS universal GUI DMG (Intel + Apple Silicon)

          The macOS build is ad-hoc signed and is not Apple-notarized yet.

          Unofficial Arabic-focused fork of the GPL-licensed Vencord Installer. It downloads Vencord Arabic builds from ShadowUR0/Vencord and is not affiliated with Discord or the official Vencord team.

          Source commit: $GITHUB_SHA
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Vencord Arabic Installer - $tag" --notes-file release-notes.md
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Vencord Arabic Installer - $tag" --notes-file release-notes.md
          fi
