name: Liquid Glass Installer CI

on:
  push:
    branches:
      - feat/liquid-glass-wails
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Resolve Go modules
        shell: pwsh
        run: go mod tidy

      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Liquid Glass installer
        shell: pwsh
        run: wails build -clean

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: VencordArabicInstaller-Windows
          path: build/bin/*.exe
          if-no-files-found: error
