name: Test Installer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Run CLI tests
        run: go test -tags cli ./...
